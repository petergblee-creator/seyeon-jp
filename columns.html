<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>コラム｜世淵（セヨン）会計法人 イ・ギュボム</title>
<meta name="description" content="韓国子会社の会計・税務・本社報告に役立つ実務コラム。韓国公認会計士 イ・ギュボム（ピーター）が日本語で解説します。">
<link rel="icon" href="favicon-32x32.png">
<style>
:root{--blue:#3E6DB0;--navy:#1A2B4A;--ink:#222;--muted:#5d6775;--line:#D8E2EE}
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);line-height:1.7}
header{background:var(--navy);padding:14px 20px}header a{color:#fff;text-decoration:none;font-weight:700}
main{max-width:760px;margin:0 auto;padding:36px 20px 60px}
h1{color:var(--navy);font-size:26px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 24px}
.item{display:block;border:1px solid var(--line);padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--blue)}.item time{font-size:13px;color:var(--muted)}.item h2{font-size:18px;color:var(--navy);margin:4px 0 6px}.item p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header><a href="https://jp.seyeon-tax.com/">世淵（セヨン）会計法人｜イ・ギュボム チーム</a></header>
<main>
<h1>コラム</h1>
<p class="sub">韓国子会社の会計・税務・本社報告に役立つ実務メモを、日本語でお届けします。</p>
<div id="list"></div>
</main>
<script>
fetch('columns.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
 const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 document.getElementById('list').innerHTML=d.articles.slice().sort((a,b)=>a.date<b.date?1:-1).map(a=>'<a class="item" href="'+e(a.slug)+'"><time>'+e(a.date)+'</time><h2>'+e(a.title)+'</h2><p>'+e(a.summary)+'</p></a>').join('');
});
</script>
</body>
</html>
